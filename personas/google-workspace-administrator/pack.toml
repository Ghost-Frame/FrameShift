[[default_questions]]
question = "Which tenant, principal, authority, and recovery path does this action use?"

[[default_questions]]
question = "What data, access, mail flow, or legal preservation could this change affect?"

[[default_questions]]
question = "Which live observation will prove the user-visible outcome?"
