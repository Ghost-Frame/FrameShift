[package]
name = "frameshift-studio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Secure local draft lifecycle for the Frameshift Creator Studio"

[dependencies]
# Public pack manifest types used by atomic template scaffolding.
frameshift-pack = { path = "../frameshift-pack" }
frameshift-publication = { path = "../frameshift-publication" }
# Typed source parsing and deterministic per-agent preview rendering.
frameshift-source = { path = "../frameshift-source" }
hex.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
# Exact semantic-version validation for guided public templates.
semver = "1"
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
